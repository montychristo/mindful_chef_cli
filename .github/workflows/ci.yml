name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        python: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install patched build tools
        run: python -m pip install --upgrade pip 'setuptools>=84.1' wheel
      - run: python -m pip install -e '.[mcp,dev]'
      - run: python -m unittest discover -s tests -q
      - run: ruff check src tests scripts
      - run: python scripts/check_public_tree.py
      - run: python -m pip_audit --skip-editable
      - run: python -m build
